[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pplx-connector-lint"
dynamic = ["version"]
description = "Lint a Perplexity Computer skill's connector usage against the live connector schema"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["perplexity", "computer", "connectors", "lint", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jamie0x33-bb/pplx-connector-lint"
Documentation = "https://github.com/jamie0x33-bb/pplx-connector-lint/tree/main/docs"
Issues = "https://github.com/jamie0x33-bb/pplx-connector-lint/issues"
Changelog = "https://github.com/jamie0x33-bb/pplx-connector-lint/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
connector-lint = "pplx_connector_lint.cli:main"

[tool.hatch.version]
path = "src/pplx_connector_lint/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pplx_connector_lint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

